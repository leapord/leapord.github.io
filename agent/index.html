<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Agent Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.1/dist/index.css">
  <script src="https://unpkg.com/element-plus@2.4.1/dist/index.full.min.js"></script>
</head>
<body>
<div id="app">
  <el-container style="min-height:100vh;">
    <el-header style="background:#fff;padding:0 24px;box-shadow:0 2px 6px rgba(0,0,0,.08);">
      <el-row :gutter="20" align="middle">
        <el-col :span="12"><h2 style="margin:0;color:#303133;">Agent Dashboard</h2></el-col>
        <el-col :span="12" style="text-align:right;">
          <el-link href="/agent/index.html" type="primary">Dashboard Home</el-link>
        </el-col>
      </el-row>
    </el-header>
    <el-main style="padding:24px;max-width:1100px;margin:auto;">
      <!-- Tabs for Report and Skills -->
      <el-tabs v-model="activeTab" style="margin-bottom:24px;">
        <el-tab-pane label="日报" name="report"></el-tab-pane>
        <el-tab-pane label="Skills" name="skills"></el-tab-pane>
      </el-tabs>
      <div v-if="activeTab === 'report'">
        <el-card class="box-card" style="margin-bottom:24px;">
          <template #header><span style="font-weight:600;">最新 AI 报告</span></template>
          <el-table :data="reports" style="width:100%" stripe>
            <el-table-column prop="name" label="文件名" width="260">
              <template #default="{row}">
                <el-link :href="row.url" target="_blank">{{ row.name }}</el-link>
              </template>
            </el-table-column>
            <el-table-column prop="date" label="日期" width="120"></el-table-column>
          </el-table>
        </el-card>
      </div>
      <div v-else-if="activeTab === 'skills'">
        <el-card class="box-card" style="margin-bottom:24px;">
          <template #header><span style="font-weight:600;">最新 Skills 报告</span></template>
          <el-table :data="skillReports" style="width:100%" stripe>
            <el-table-column prop="name" label="文件名" width="260">
              <template #default="{row}">
                <el-link :href="row.url" target="_blank">{{ row.name }}</el-link>
              </template>
            </el-table-column>
            <el-table-column prop="date" label="日期" width="120"></el-table-column>
          </el-table>
        </el-card>
      </div>
      <!-- List of all pages (fallback) -->
      <el-card class="box-card">
        <template #header><span style="font-weight:600;">所有页面</span></template>
        <el-table :data="allPages" style="width:100%" stripe>
          <el-table-column prop="name" label="文件名" width="260">
            <template #default="{row}">
              <el-link :href="row.url" target="_blank">{{ row.name }}</el-link>
            </template>
          </el-table-column>
        </el-table>
      </el-card>
    </el-main>
    <el-footer style="text-align:center;padding:12px 0;color:#999;font-size:13px;">
      © {{ new Date().getFullYear() }} Leapord · <el-link href="https://github.com/leapord/agent" target="_blank">私有仓库</el-link>
    </el-footer>
  </el-container>
</div>
<script>
const { createApp, ref, onMounted } = Vue
createApp({
  setup(){
    const activeTab = ref('report')
    const allPages = ref([])
    const reports = ref([])
    const skillReports = ref([])
    onMounted(()=>{
      fetch('pages.json')
        .then(r=>r.json())
        .then(list=>{
          // list is array of filenames e.g. ["index.html","report-2026-05-05.html","skills-2026-05-05.html"]
          const today = new Date().toISOString().slice(0,10)
          allPages.value = list.map(name=>({name, url:`./${name}`}))
          reports.value = list.filter(n=>/^report-\d{4}-\d{2}-\d{2}\.html$/.test(n)).map(name=>({name, url:`./${name}`, date:name.slice(7,17)}))
          skillReports.value = list.filter(n=>/^skills?-\d{4}-\d{2}-\d{2}\.html$/.test(n)).map(name=>({name, url:`./${name}`, date:name.slice(7,17)}))
        })
        .catch(()=>{ console.warn('pages.json not found') })
    })
    return { activeTab, allPages, reports, skillReports }
  }
}).use(ElementPlus).mount('#app')
</script>
</body>
</html>
