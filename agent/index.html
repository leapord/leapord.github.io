<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Agent Dashboard | Leapord</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.1/dist/index.css">
  <script src="https://unpkg.com/element-plus@2.4.1/dist/index.full.min.js"></script>
</head>
<body>
<div id="app">
  <el-container style="min-height:100vh;">
    <el-header style="background:#fff;padding:0 24px;box-shadow:0 2px 6px rgba(0,0,0,.08);">
      <el-row :gutter="20" align="middle">
        <el-col :span="12"><h2 style="margin:0;color:#303133;">Agent Dashboard</h2></el-col>
        <el-col :span="12" style="text-align:right;">
          <el-link href="/agent/index.html" type="primary">看板首页</el-link>
        </el-col>
      </el-row>
    </el-header>
    <el-main style="padding:24px;max-width:1100px;margin:auto;">
      <!-- 今日报告按钮 -->
      <el-button type="primary" @click="openLatest" style="margin-bottom:24px;">
        📄 今日报告（{{ latest.date }})
      </el-button>

      <!-- 页面列表 -->
      <el-card class="box-card">
        <template #header><span style="font-weight:600;">📚 所有页面（共 {{ pages.length }}）</span></template>
        <el-table :data="pages" style="width:100%" stripe>
          <el-table-column prop="index" label="#" width="60" align="center">
            <template #default="{row, $index}">{{ $index + 1 }}</template>
          </el-table-column>
          <el-table-column prop="path" label="路径">
            <template #default="{row}">
              <el-link :href="row" target="_blank">{{ row }}</el-link>
            </template>
          </el-table-column>
        </el-table>
      </el-card>
    </el-main>
    <el-footer style="text-align:center;padding:12px 0;color:#999;font-size:13px;">
      © {{ new Date().getFullYear() }} Leapord · <el-link href="https://github.com/leapord/agent" target="_blank">私有仓库</el-link>
    </el-footer>
  </el-container>
</div>
<script>
const { createApp, ref, onMounted } = Vue
createApp({
  setup(){
    const today = new Date()
    const iso = today.toISOString().slice(0,10)
    const latest = {date: iso, url: `./report-${iso}.html`}
    const pages = ref([])
    const openLatest = () => { window.open(latest.url,'_blank') }
    onMounted(()=>{
      fetch('pages.json')
        .then(r=>r.json())
        .then(data=>{ pages.value = data })
        .catch(()=>{ console.warn('pages.json not found') })
    })
    return { latest, pages, openLatest }
  }
}).use(ElementPlus).mount('#app')
</script>
</body>
</html>
